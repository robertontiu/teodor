<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
<defs>
<radialGradient id="warm" cx="0.56" cy="0.36" r="0.78">
 <stop offset="0" stop-color="#fffaf0"/><stop offset="0.10" stop-color="#fff0bd"/>
 <stop offset="0.28" stop-color="#ffd062"/><stop offset="0.48" stop-color="#f89a3a"/>
 <stop offset="0.68" stop-color="#e5623f"/><stop offset="0.86" stop-color="#bf4560"/><stop offset="1" stop-color="#8c3b62"/></radialGradient>
<linearGradient id="tide" x1="0" y1="1" x2="0.7" y2="0.3">
 <stop offset="0" stop-color="#121c48"/><stop offset="0.5" stop-color="#24387a"/><stop offset="0.85" stop-color="#5059a6"/><stop offset="1" stop-color="#8a63a8"/></linearGradient>
<filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect width="1200" height="1600" fill="url(#warm)"/>
<!-- rose-violet dusk where they meet: a diagonal, not a horizon -->
<path d="M-100 700 C150 820 330 1000 560 1180 C760 1330 980 1430 1300 1480 L1300 1700 L-100 1700Z" fill="#c4466f" filter="url(#b60)" opacity="0.8"/>
<!-- cool tide entering from lower-left corner as broad sweeps -->
<path d="M-100 860 C120 960 300 1140 520 1290 C700 1410 900 1500 1300 1560 L1300 1700 L-100 1700Z" fill="url(#tide)" filter="url(#b30)"/>
<g fill="none" stroke-linecap="round" filter="url(#b10)">
 <path d="M-20 980 C150 1060 300 1170 470 1260" stroke="#2b3c88" stroke-width="70"/>
 <path d="M40 1200 C220 1290 420 1380 640 1450" stroke="#1a2760" stroke-width="90"/>
 <path d="M120 1060 C260 1110 360 1170 430 1200" stroke="#6a5cae" stroke-width="30" opacity="0.8"/>
</g>
<!-- cool breath along the right edge too, faint -->
<path d="M1260 600 C1180 800 1160 1000 1200 1300" stroke="#7a5aa0" stroke-width="80" fill="none" filter="url(#b60)" opacity="0.5"/>
<!-- the lift: a fan of rising gestures, uneven, from the dusk zone up and outward -->
<g fill="none" stroke-linecap="round" filter="url(#b3)">
 <path d="M470 1090 C520 930 580 800 650 660" stroke="#fffdf4" stroke-width="34"/>
 <path d="M560 1120 C640 980 720 880 830 780" stroke="#ffe39a" stroke-width="22"/>
 <path d="M520 1000 C540 860 560 740 560 600" stroke="#fff6d8" stroke-width="16"/>
 <path d="M610 1030 C700 920 820 850 960 830" stroke="#ffc35a" stroke-width="16"/>
 <path d="M420 1010 C410 900 380 820 330 740" stroke="#ffb27a" stroke-width="14"/>
 <path d="M500 900 C560 760 640 610 720 500" stroke="#ffffff" stroke-width="9"/>
 <path d="M680 960 C770 860 860 780 940 700" stroke="#fff1c4" stroke-width="8"/>
 <!-- cool reaching into the warm -->
 <path d="M250 960 C320 920 380 880 430 820" stroke="#3a4fa0" stroke-width="11"/>
 <path d="M900 1330 C960 1260 1030 1180 1090 1080" stroke="#5a5eb2" stroke-width="10"/>
 <!-- warm embers left in the cool -->
 <path d="M230 1390 L300 1370" stroke="#f2a64a" stroke-width="14"/>
 <path d="M640 1500 L700 1492" stroke="#e8784a" stroke-width="10"/>
 <path d="M380 1290 L420 1275" stroke="#ffcf7a" stroke-width="8"/>
</g>
<ellipse cx="40" cy="60" rx="340" ry="280" fill="#a03e58" opacity="0.5" filter="url(#b60)"/>
<ellipse cx="1200" cy="120" rx="320" ry="320" fill="#bf544c" opacity="0.4" filter="url(#b60)"/>
</svg>
