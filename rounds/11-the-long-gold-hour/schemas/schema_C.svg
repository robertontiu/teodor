<path d="M-100 860 C120 960 300 1140 520 1290 C700 1410 900 1500 1300 1560 L1300 1700 L-100 1700Z" fill="url(#tide)" filter="url(#b30)"/>
<g fill="none" stroke-linecap="round" filter="url(#b10)">
 <path d="M-20 980 C150 1060 300 1170 470 1260" stroke="#2b3c88" stroke-width="70"/>
 <path d="M40 1200 C220 1290 420 1380 640 1450" stroke="#1a2760" stroke-width="90"/>
 <path d="M120 1060 C260 1110 360 1170 430 1200" stroke="#6a5cae" stroke-width="30" opacity="0.8"/>
</g>
<!-- cool breath along the right edge too, faint -->
<path d="M1260 600 C1180 800 1160 1000 1200 1300" stroke="#7a5aa0" stroke-width="80" fill="none" filter="url(#b60)" opacity="0.5"/>
