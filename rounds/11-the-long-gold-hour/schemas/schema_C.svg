 <path d="M300 940 C430 990 560 1060 700 1150 C780 1200 880 1250 1000 1280" stroke="#fff0b8" stroke-width="18"/>
 <path d="M500 1250 C650 1330 820 1390 1040 1440" stroke="#6c5bb0" stroke-width="28"/>
 <path d="M40 1120 C180 1170 300 1240 420 1320" stroke="#f08a46" stroke-width="16"/>
</g>
<!-- a few separate risings in the light, not from one root -->
<g fill="none" stroke-linecap="round" filter="url(#b8)">
 <path d="M420 860 C460 760 520 680 580 600" stroke="#fff6dc" stroke-width="40" opacity="0.8"/>
 <path d="M720 900 C760 800 800 720 860 650" stroke="#ffe7a0" stroke-width="34" opacity="0.8"/>
 <path d="M580 760 C610 660 640 580 680 500" stroke="#ffffff" stroke-width="30" opacity="0.9"/>
</g>
<g fill="none" stroke-linecap="round" filter="url(#b3)">
