<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
<defs>
<radialGradient id="warm" cx="0.56" cy="0.36" r="0.78">
 <stop offset="0" stop-color="#fffaf0"/><stop offset="0.10" stop-color="#fff0bd"/>
 <stop offset="0.28" stop-color="#ffd062"/><stop offset="0.48" stop-color="#f89a3a"/>
 <stop offset="0.68" stop-color="#e5623f"/><stop offset="0.86" stop-color="#bf4560"/><stop offset="1" stop-color="#8c3b62"/></radialGradient>
<linearGradient id="tide" x1="0" y1="1" x2="0.7" y2="0.3">
 <stop offset="0" stop-color="#121c48"/><stop offset="0.5" stop-color="#24387a"/><stop offset="0.85" stop-color="#5059a6"/><stop offset="1" stop-color="#8a63a8"/></linearGradient>
<filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect width="1200" height="1600" fill="url(#warm)"/>
<!-- rose-violet dusk where they meet: a diagonal, not a horizon -->
<path d="M-100 700 C150 820 330 1000 560 1180 C760 1330 980 1430 1300 1480 L1300 1700 L-100 1700Z" fill="#c4466f" filter="url(#b60)" opacity="0.8"/>
