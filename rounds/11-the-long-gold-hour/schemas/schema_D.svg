<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
<defs>
<radialGradient id="warm" cx="0.55" cy="0.40" r="0.70" gradientTransform="rotate(28 0.55 0.40) translate(0.55 0.40) scale(1.25 0.8) translate(-0.55 -0.40)">
 <stop offset="0" stop-color="#fffaf0"/><stop offset="0.12" stop-color="#fff0bd"/>
 <stop offset="0.30" stop-color="#ffcf60"/><stop offset="0.50" stop-color="#f6963a"/>
 <stop offset="0.70" stop-color="#e0603f"/><stop offset="0.88" stop-color="#b04260"/><stop offset="1" stop-color="#6e3466"/></radialGradient>
<linearGradient id="tide" x1="0" y1="1" x2="0.7" y2="0.3">
 <stop offset="0" stop-color="#101a44"/><stop offset="0.5" stop-color="#22357a"/><stop offset="0.85" stop-color="#4e57a4"/><stop offset="1" stop-color="#8a63a8"/></linearGradient>
<filter id="b80" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
<filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect width="1200" height="1600" fill="url(#warm)"/>
<!-- evening already in the high air: deep crimson-violet veils from the top corners -->
<path d="M-100 -100 L560 -100 C430 60 280 200 160 420 C100 540 40 640 -100 700Z" fill="#5c2c62" filter="url(#b80)" opacity="0.85"/>
<path d="M1300 -100 L840 -100 C960 40 1080 160 1300 260Z" fill="#7a3866" filter="url(#b80)" opacity="0.7"/>
<path d="M1300 500 C1180 700 1150 950 1200 1300 L1300 1300Z" fill="#7a4a92" filter="url(#b80)" opacity="0.6"/>
<!-- the light: not a disc, a broad warm breath leaning on the diagonal -->
<ellipse cx="660" cy="700" rx="420" ry="170" transform="rotate(26 660 700)" fill="#fff6dc" filter="url(#b40)" opacity="0.85"/>
<path d="M520 640 C620 690 720 760 840 860" stroke="#fffdf6" stroke-width="60" fill="none" stroke-linecap="round" filter="url(#b12)" opacity="0.9"/><ellipse cx="0" cy="0" rx="1" ry="1" fill="#fffdf6" filter="url(#b12)" opacity="0.9"/>
<!-- cool veil drifting into the light from the upper left, broad and unpaired -->
<path d="M120 260 C260 330 380 420 470 540 C500 590 520 640 530 700" stroke="#7d5aa6" stroke-width="90" fill="none" stroke-linecap="round" filter="url(#b40)" opacity="0.55"/>
<path d="M240 330 C330 380 400 440 450 500" stroke="#9a6ab0" stroke-width="26" fill="none" stroke-linecap="round" filter="url(#b3)" opacity="0.7"/>
<!-- rose dusk where they meet -->
<path d="M-100 760 C150 860 330 1020 560 1190 C760 1330 980 1430 1300 1480 L1300 1700 L-100 1700Z" fill="#c4466f" filter="url(#b40)" opacity="0.85"/>
<!-- cool tide -->
<path d="M-100 880 C120 980 300 1150 520 1300 C700 1420 900 1510 1300 1570 L1300 1700 L-100 1700Z" fill="url(#tide)" filter="url(#b40)"/>
<g fill="none" stroke-linecap="round" filter="url(#b12)">
 <path d="M-20 1000 C150 1080 300 1190 470 1280" stroke="#2b3c88" stroke-width="80"/>
 <path d="M40 1220 C220 1310 420 1400 640 1470" stroke="#16225a" stroke-width="110"/>
</g>
<!-- the seam -->
<g fill="none" stroke-linecap="round" filter="url(#b3)">
 <path d="M60 870 C260 930 430 1020 600 1120 C700 1180 820 1240 980 1300" stroke="#ffb347" stroke-width="44"/>
 <path d="M0 970 C200 1020 380 1120 560 1220 C700 1300 860 1360 1100 1400" stroke="#d24a68" stroke-width="40"/>
 <path d="M300 950 C430 1000 560 1070 700 1160 C780 1210 880 1260 1000 1290" stroke="#fff0b8" stroke-width="16"/>
 <path d="M500 1260 C650 1340 820 1400 1040 1450" stroke="#6c5bb0" stroke-width="28"/>
</g>
</svg>
