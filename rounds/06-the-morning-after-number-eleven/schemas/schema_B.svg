<g fill="#1a1716">
 <ellipse cx="884" cy="1068" rx="13" ry="15"/>
 <path d="M868 1078 C858 1100 862 1130 872 1150 L846 1160 C846 1172 900 1172 920 1166 L908 1148 C912 1120 906 1092 898 1080 Z"/>
 <path d="M874 1092 C864 1104 870 1118 884 1110" stroke="#1a1716" stroke-width="7" fill="none"/>
</g>
<ellipse cx="885" cy="1170" rx="50" ry="6" fill="#141212" opacity="0.6"/>
<!-- FENCE (dividing the plots, receding to vanishing point ~640,1020) -->
<g stroke="#5a4636" stroke-linecap="round">
 <line x1="742" y1="1600" x2="645" y2="1030" stroke-width="5" opacity="0.0"/>
 <line x1="725" y1="1470" x2="650" y2="1050" stroke-width="6"/>
 <line x1="736" y1="1400" x2="652" y2="1036" stroke-width="5"/>
</g>
<g fill="#4e3c2e">
 <rect x="716" y="1250" width="16" height="230"/>
 <rect x="690" y="1180" width="12" height="130"/>
 <rect x="674" y="1130" width="9" height="88"/>
 <rect x="664" y="1094" width="7" height="60"/>
 <rect x="657" y="1068" width="5" height="40"/>
</g>
<!-- long shadow of the man, thrown across onto their ground -->
<polygon points="470,1400 560,1392 1060,1470 1080,1500 600,1420" fill="#1a1614" opacity="0.55" filter="url(#b4)"/>
<!-- THE MAN, from behind, slumped, head sunk and turned toward the ruin -->
