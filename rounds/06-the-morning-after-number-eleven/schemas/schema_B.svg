<polygon points="0,1030 640,1020 760,1600 0,1600" fill="url(#groundL)"/>
<path d="M640 1020 L1200 1030 L1200 1600 L770 1600 C740 1500 700 1450 690 1380 C670 1300 690 1200 660 1120 Z" fill="url(#groundR)" filter="url(#b4)"/>
