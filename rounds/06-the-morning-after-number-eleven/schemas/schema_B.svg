<ellipse cx="960" cy="1250" rx="120" ry="16" fill="#b8a48a" opacity="0.55" filter="url(#b4)"/>
<ellipse cx="1080" cy="1420" rx="90" ry="14" fill="#9d8c78" opacity="0.45" filter="url(#b4)"/>
<!-- SAVED HOUSE -->
<polygon points="60,700 230,540 400,700 400,1050 60,1050" fill="#c99a68"/><polygon points="60,700 230,540 240,552 72,708 72,1050 60,1050" fill="#f6dcaa"/>
<polygon points="400,700 230,540 300,520 470,690" fill="#9b5a3c"/>
<polygon points="400,700 470,690 470,1035 400,1050" fill="#7e6048"/>
<polygon points="40,712 230,528 420,712 400,700 230,545 60,700" fill="#5a3426"/>
<rect x="180" y="860" width="88" height="190" fill="#4a3022"/>
<rect x="92" y="760" width="62" height="78" fill="#3a2c26"/><rect x="96" y="764" width="54" height="70" fill="#f6d88e" opacity="0.85"/>
<rect x="300" y="760" width="62" height="78" fill="#3a2c26"/><rect x="304" y="764" width="54" height="70" fill="#d9b27a" opacity="0.6"/>
<rect x="208" y="600" width="44" height="50" fill="#3a2c26"/>
