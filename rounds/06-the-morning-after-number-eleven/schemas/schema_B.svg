 <ellipse cx="530" cy="1052" rx="25" ry="27" fill="#3e2c22" transform="rotate(20 530 1052)"/>
 <path d="M508 1040 C512 1028 526 1024 534 1028 C522 1034 514 1044 512 1056 Z" fill="#cf9e6c"/>
</g>
