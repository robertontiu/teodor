<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.3">
  <stop offset="0" stop-color="#f3dcae"/><stop offset="0.45" stop-color="#e2b982"/><stop offset="0.75" stop-color="#7d7068"/><stop offset="1" stop-color="#3f3a3b"/></linearGradient>
 <radialGradient id="sun" cx="0.05" cy="0.42" r="0.55"><stop offset="0" stop-color="#fff4d6" stop-opacity="0.95"/><stop offset="1" stop-color="#f3d39c" stop-opacity="0"/></radialGradient>
 <linearGradient id="groundL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a88a52"/><stop offset="0.5" stop-color="#8a7448"/><stop offset="1" stop-color="#6a5f4c"/></linearGradient>
 <linearGradient id="groundR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c4846"/><stop offset="1" stop-color="#2c2a2b"/></linearGradient>
 <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1d1915" stop-opacity="0.55"/></linearGradient>
 <linearGradient id="smoke" x1="0" y1="1" x2="0.4" y2="0"><stop offset="0" stop-color="#3a3434"/><stop offset="0.6" stop-color="#5a5250"/><stop offset="1" stop-color="#6e6560"/></linearGradient>
 <filter id="b30"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="b12"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
 <filter id="b2"><feGaussianBlur stdDeviation="1.5"/></filter>
</defs>
<rect width="1200" height="1040" fill="url(#sky)"/>
<rect width="1200" height="1040" fill="url(#sun)"/>
<!-- smoke -->
<path d="M900 860 C860 700 960 600 930 480 C900 350 1010 260 1000 120 C995 40 1050 -20 1100 -40 L1260 -40 L1260 700 C1180 640 1080 700 1040 760 Z" fill="url(#smoke)" filter="url(#b30)" opacity="0.9"/>
<path d="M915 820 C890 700 960 610 940 500 C920 400 990 320 990 220" stroke="#c9a57a" stroke-width="26" fill="none" opacity="0.35" filter="url(#b12)"/>
