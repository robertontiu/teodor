<ellipse cx="240" cy="1150" rx="330" ry="70" fill="#d8b679" opacity="0.5" filter="url(#b30)"/>
<!-- RUIN -->
<path d="M720 1035 L720 820 L760 800 L775 860 L800 760 L830 800 L850 720 L880 790 L900 850 L940 830 L960 900 L990 870 L995 640 L1035 640 L1035 840 L1060 800 L1090 860 L1120 780 L1160 830 L1170 1040 Z" fill="#1e1b1a"/>
