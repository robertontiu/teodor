 <path d="M554 1072 C582 1110 604 1146 628 1170 L640 1184 L628 1194 C600 1172 572 1140 546 1108 Z" fill="#33271f"/>
 <ellipse cx="640" cy="1186" rx="13" ry="9" fill="#7a5640"/>
 <path d="M462 1080 C452 1120 452 1166 458 1210 L474 1210 C472 1166 474 1120 482 1086 Z" fill="#2f241c"/>
